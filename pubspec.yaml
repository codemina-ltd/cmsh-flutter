name: cmsh_flutter
description: Deep links and full-journey attribution for CMSH.io short links. See who clicked, installed and converted in your Flutter app.
version: 0.1.0
homepage: https://cmsh.io
repository: https://github.com/codemina-ltd/cmsh-flutter
issue_tracker: https://github.com/codemina-ltd/cmsh-flutter/issues
topics:
  - deep-linking
  - attribution
  - analytics
  - links

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  app_links: ^7.0.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.cmsh.cmsh_flutter
        pluginClass: CmshFlutterPlugin
      ios:
        pluginClass: CmshFlutterPlugin
